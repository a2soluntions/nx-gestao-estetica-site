<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador Web Interativo • NX Gestão Estética v2.5</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Segoe UI', 'Plus Jakarta Sans', 'Inter', sans-serif;
      background-color: #060807;
      color: #FFFFFF;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #060807; }
    ::-webkit-scrollbar-thumb { background: #1A2E20; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #00FF41; }
  </style>
</head>
<body class="h-screen w-screen flex flex-col overflow-hidden">
  <div id="painel-exp-simulador" class="w-full h-full flex flex-col overflow-hidden">
    <div id="nx-web-app-root" class="w-full h-full"></div>
  </div>

  <!-- Modal de Feedback Interno do Simulador -->
  <div id="nx-sim-modal" class="fixed inset-0 z-[150] hidden items-center justify-center bg-black/75 p-4 backdrop-blur-sm" onclick="if(event.target.id==='nx-sim-modal') nxSimCloseModal()">
    <div class="w-full max-w-lg rounded-2xl bg-[#0A100C] border-2 border-[#00FF41] shadow-2xl overflow-hidden text-left">
      <div class="px-5 py-3.5 bg-[#0E1812] border-b border-[#1A2E20] flex items-center justify-between">
        <h4 id="nx-sim-modal-title" class="text-sm font-extrabold text-[#00FF41]">NX Gestão Estética v2.5</h4>
        <button type="button" onclick="nxSimCloseModal()" class="text-[#8C9990] hover:text-white text-sm font-bold px-2 py-0.5 rounded">✕</button>
      </div>
      <div id="nx-sim-modal-body" class="p-5 text-xs sm:text-sm text-[#D2DDD5] whitespace-pre-line leading-relaxed max-h-[70vh] overflow-y-auto font-mono"></div>
      <div class="px-5 py-3 bg-[#080C09] border-t border-[#162219] flex justify-end gap-2">
        <button type="button" onclick="nxSimCloseModal()" class="px-5 py-2 rounded-lg bg-[#00FF41] hover:bg-[#1AFF53] text-[#040805] font-extrabold text-xs transition">
          Entendido
        </button>
      </div>
    </div>
  </div>

  <script src="simulador_app.js"></script>
</body>
</html>
